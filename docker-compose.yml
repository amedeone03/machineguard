services:
  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: machineguard
      POSTGRES_USER: machineguard
      POSTGRES_PASSWORD: machineguard

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/machineguard/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql


  mlflow:
    build: .

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/mlartifacts
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*

    ports:
      - "5001:5000"

    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts


  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: machineguard
      DB_USER: machineguard
      DB_PASSWORD: machineguard

    depends_on:
      - postgres
      - mlflow


  dashboard:
    build: .

    command:
      - streamlit
      - run
      - src/machineguard/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    ports:
      - "8501:8501"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: machineguard
      DB_USER: machineguard
      DB_PASSWORD: machineguard

    depends_on:
      - postgres


volumes:
  postgres_data: