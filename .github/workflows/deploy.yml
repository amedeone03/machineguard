name: Deploy to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: machineguard
  ECS_CLUSTER: machineguard-cluster

  API_SERVICE: machineguard-api-service
  API_TASK_DEFINITION: machineguard-api
  API_CONTAINER_NAME: api

  DASHBOARD_SERVICE: machineguard-dashboard-service
  DASHBOARD_TASK_DEFINITION: machineguard-dashboard
  DASHBOARD_CONTAINER_NAME: dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::020784397951:role/machineguard-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker buildx build \
            --platform linux/arm64 \
            -t $IMAGE_URI \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push \
            .

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------
      # FastAPI
      # ---------------------------------------------------

      - name: Download current API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $API_TASK_DEFINITION \
            --query taskDefinition \
            > api-task-definition.json

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-definition.json
          container-name: ${{ env.API_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy API to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      # ---------------------------------------------------
      # Streamlit dashboard
      # ---------------------------------------------------

      - name: Download current dashboard task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $DASHBOARD_TASK_DEFINITION \
            --query taskDefinition \
            > dashboard-task-definition.json

      - name: Render dashboard task definition
        id: render-dashboard
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: dashboard-task-definition.json
          container-name: ${{ env.DASHBOARD_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy dashboard to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-dashboard.outputs.task-definition }}
          service: ${{ env.DASHBOARD_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15